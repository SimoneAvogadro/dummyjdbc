# CircleCI configuration: builds the jar and runs the unit tests with Maven.
#
# The project targets Java 8 bytecode, but the build (AspectJ 1.9.22) needs a recent JDK.
#
version: 2.1

jobs:
  build:
    docker:
      - image: cimg/openjdk:21.0

    working_directory: ~/repo

    steps:
      - checkout

      # Download and cache dependencies
      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "pom.xml" }}
            # fallback to using the latest cache if no exact match is found
            - v2-dependencies-

      # Build the jar and run the tests
      - run: mvn -B clean verify

      - save_cache:
          paths:
            - ~/.m2
          key: v2-dependencies-{{ checksum "pom.xml" }}

      - store_test_results:
          path: target/surefire-reports

      - store_artifacts:
          path: target/surefire-reports

workflows:
  build:
    jobs:
      - build
